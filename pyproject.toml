[project]
name = "project-paperwork-latex-suit"
version = "0.1.0"
requires-python = ">=3.15.2"
dependencies = [
    "click>=8.5.1",
]

[project.scripts]
paper = "paperwork.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "paperwork"

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.108",
]

