# ---------------------------------------------------------------------------
# One always-on compile service for every paper and optional preview tool.
# Use bin/paper, not docker compose directly, so PAPER_ROOT is always set.
# TEXLIVE and TEXLIVE_SCHEME are image settings; apply changes with bin/paper rebuild.
# ---------------------------------------------------------------------------
services:
  paper:
    image: "${PAPER_IMAGE:-paper-latex:${TEXLIVE:-latest}}"
    build:
      context: image
      args:
        TEXLIVE: "${TEXLIVE:-latest}"
        SCHEME: "${TEXLIVE_SCHEME:-scheme-full}"
        BUILD_ID: "${BUILD_ID:-dev}"
    container_name: "${PAPER_CONTAINER_NAME:-paper-latex}"
    command: sleep infinity
    healthcheck:
      test: [CMD-SHELL, "command -v latexmk >/dev/null && command -v pdflatex >/dev/null && test -w /build"]
      interval: 5s
      timeout: 2s
      retries: 3
    init: true
    restart: unless-stopped
    read_only: true
    network_mode: "${NETWORK:-bridge}"
    cpus: "${CPUS:-4}"
    mem_limit: "${MEMORY:-4g}"
    environment:
      PAPER_ROOT: "${PAPER_ROOT:?use bin/paper, not docker compose directly}"
      PAPER_NETWORK: "${NETWORK:-bridge}"
    tmpfs:
      - /tmp
      - "/build:size=${BUILD_RAM:-2g},mode=1777,exec"
    volumes:
      # Identical paths on both sides keep SyncTeX and editor navigation working.
      - "${PAPER_ROOT}:${PAPER_ROOT}"
      - cache:/cache

volumes:
  cache:
